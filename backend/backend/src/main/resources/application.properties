spring.application.name=backend
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/vanrentaldb
spring.datasource.username=postgres
spring.datasource.password=crud

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port (optional, default is 8080)
server.port=8080

# ---- Bookings & uploads ----
# Down payment (in pesos) required to book; it is part of the total price
app.booking.down-payment=500
# Proof-of-payment images: max 5 MB per file
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Let Tomcat read (and reject properly) uploads a bit over the limit instead of cutting the connection
server.tomcat.max-swallow-size=10MB

# ---- Security ----
# ${NAME:default} reads the environment variable NAME, or uses the default after the colon.
# The defaults are for local development only. Set real values before putting this online.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.validity-hours=8
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Google sign-in for customers: the OAuth Client ID from Google Cloud Console (not a secret).
# Must match environment.ts googleClientId in the frontend.
app.google.client-id=${GOOGLE_CLIENT_ID:195255917717-dl1cp2e1gnfoarjcv5096oet2qflq39e.apps.googleusercontent.com}

# ---- Email ----
# Emails are sent automatically (booking received / payment rejected / booking confirmed).
# Mail is OFF until a mail server is configured; until then emails are only written to the log.
#
# Set it up ONCE: copy secrets.properties.example (next to this file) to secrets.properties and fill in
# your Gmail address + App Password. That file is loaded automatically on every start (IntelliJ or mvnw)
# and is git-ignored, so the password never ends up on GitHub.
# (On a server, use environment variables instead: SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, ...)
spring.config.import=optional:classpath:secrets.properties
app.mail.from=${MAIL_FROM:no-reply@vanrental.local}
app.business.name=${BUSINESS_NAME:Van Rental}
# Where the website runs; used for links in emails (e.g. the "upload a new screenshot" link)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}