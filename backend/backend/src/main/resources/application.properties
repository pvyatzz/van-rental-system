spring.application.name=backend
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/vanrentaldb
spring.datasource.username=postgres
spring.datasource.password=crud

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port (optional, default is 8080)
server.port=8080

# ---- Security ----
# ${NAME:default} reads the environment variable NAME, or uses the default after the colon.
# The defaults are for local development only. Set real values before putting this online.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.validity-hours=8
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Google sign-in for customers: the OAuth Client ID from Google Cloud Console (not a secret).
# Must match environment.ts googleClientId in the frontend.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---- Email ----
# Mail is OFF until a server is configured; until then emails are written to the log.
# To send real email, set these environment variables (example: Gmail with an App Password):
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=you@gmail.com  SPRING_MAIL_PASSWORD=<16-character app password>
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
#   MAIL_FROM=you@gmail.com
app.mail.from=${MAIL_FROM:no-reply@vanrental.local}
app.business.name=${BUSINESS_NAME:Van Rental}