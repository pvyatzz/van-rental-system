spring.application.name=backend
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/vanrentaldb
spring.datasource.username=postgres
spring.datasource.password=crud

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port (optional, default is 8080)
server.port=8080

# ---- Security ----
# ${NAME:default} reads the environment variable NAME, or uses the default after the colon.
# The defaults are for local development only. Set real values before putting this online.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.validity-hours=8
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}