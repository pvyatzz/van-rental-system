<header class="topbar">
  <a routerLink="/vehicles" class="brand">Van Rental</a>
  <nav>
    <a routerLink="/vehicles" routerLinkActive="active">Vans</a>
    <a routerLink="/book" routerLinkActive="active">Book a van</a>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
    }
    @if (auth.isCustomer()) {
      <a routerLink="/my-bookings" routerLinkActive="active">My bookings</a>
    }
    @if (auth.loggedIn()) {
      <button type="button" class="logout" (click)="logout()">Sign out ({{ auth.displayName() }})</button>
    } @else {
      <a routerLink="/signin" routerLinkActive="active">Sign in</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  @if (!auth.loggedIn()) {
    <a routerLink="/login">Admin login</a>
  }
</footer>
